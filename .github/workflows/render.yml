name: Omilabs render
# Renders videos on GitHub's free runners (public repo) - no laptop, no Claude.
# Each item = one matrix job: build voice (Kokoro TTS) -> Remotion render -> QA -> push media/* + pkg/* branches.
# The private publisher (ogjchchv/omilabs-publisher) imports pkg/* and uploads media/* to YouTube.
on:
  push:
    paths: ["ci/todo.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.todo.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - id: todo
        run: |
          # skip items whose pkg/* branch already exists (already rendered)
          git ls-remote origin 'refs/heads/pkg/*' | sed 's#.*refs/heads/pkg/##' > done.txt
          python3 -c "import json;d=set(open('done.txt').read().split());t=[i for i in json.load(open('ci/todo.json')) if i not in d];print('items='+json.dumps(t))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  render:
    needs: plan
    if: needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 >/dev/null
          pip install -q -r ci/requirements.txt
          cd engine && npm ci --no-audit --no-fund
      - name: Kokoro voice model (cached)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tts
          key: kokoro-v1.0
      - name: Download voice model if missing
        run: |
          mkdir -p "$RUNNER_TEMP/tts"; cd "$RUNNER_TEMP/tts"
          [ -f kokoro-v1.0.onnx ] || curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la
      - name: Render ${{ matrix.item }}
        run: |
          git config user.name "omilabs-render-bot"; git config user.email "omilabs-render-bot@users.noreply.github.com"
          bash ci/render_item.sh "${{ matrix.item }}"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.item }}
          path: |
            ElevenLabs-Masterclass/Production/*.log
            Bolna-AI-Masterclass/Production/*.log
          if-no-files-found: ignore
