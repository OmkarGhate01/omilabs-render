name: Avatar preview (open-source talking head)
# Free CPU runner: Edge TTS (Hinglish) -> SadTalker (image + voice -> lip-synced head) -> push avatar-out branch.
on:
  push:
    paths: ["ci/avatar/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git st
          pip install -q torch==1.13.1+cpu torchvision==0.14.1+cpu torchaudio==0.13.1 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors edge-tts
      - name: Models
        run: |
          cd st && mkdir -p checkpoints gfpgan/weights
          B=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors SadTalker_V0.0.2_512.safetensors; do wget -q -nc $B/$f -O checkpoints/$f; done
          wget -q https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth -O gfpgan/weights/alignment_WFLW_4HG.pth
          wget -q https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth -O gfpgan/weights/detection_Resnet50_Final.pth
          wget -q https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth -O gfpgan/weights/GFPGANv1.4.pth
          wget -q https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth -O gfpgan/weights/parsing_parsenet.pth
          ls -la checkpoints gfpgan/weights
      - name: Voice
        run: |
          edge-tts --voice hi-IN-MadhurNeural --rate=+4% --file ci/avatar/script.txt --write-media voice.mp3
          ffmpeg -y -v error -i voice.mp3 -ar 16000 -ac 1 voice.wav
      - name: Talking head (crop, natural head motion)
        continue-on-error: true
        run: |
          cd st && python inference.py --driven_audio ../voice.wav --source_image ../ci/avatar/presenter.png --result_dir ../out_crop --preprocess crop --expression_scale 1.3 --cpu > ../log_crop.txt 2>&1; tail -30 ../log_crop.txt
      - name: Talking head (full image, still body)
        continue-on-error: true
        run: |
          cd st && python inference.py --driven_audio ../voice.wav --source_image ../ci/avatar/presenter.png --result_dir ../out_full --preprocess full --still --expression_scale 1.2 --cpu > ../log_full.txt 2>&1; tail -30 ../log_full.txt
      - name: Push results
        if: always()
        run: |
          mkdir -p res && find out_crop out_full -name "*.mp4" 2>/dev/null | while read f; do cp "$f" "res/$(echo $f | cut -d/ -f1)_$(basename $f)"; done; cp voice.mp3 log_*.txt res/ || true; pip freeze > res/pip.txt; ls -la res
          cd res && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -q -m avatar && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/avatar-out
